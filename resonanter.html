<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>VORTEX • Sonische Kalibratie (18 Cyclus)</title>
    <style>
        :root {
            --bg-color: #050b14;
            --panel-bg: #0f172a;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --gold: #b8860b;
            --accent: #e74c3c;
            --webrtc: #2ecc71;
            --sonic1: #3498db; /* 432 Hz */
            --sonic2: #e67e22; /* 110 Hz */
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.8);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            margin: 0 0 5px 0;
            font-size: 14pt;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p {
            margin: 0 0 15px 0;
            font-size: 8.5pt;
            color: var(--text-muted);
        }

        .status-badge {
            display: inline-flex;
            justify-content: space-between;
            width: 100%;
            background: rgba(51, 65, 85, 0.4);
            padding: 8px 12px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 9pt;
            margin-bottom: 15px;
        }
        
        .status-badge span { color: var(--gold); }

        .compass-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 0 auto 15px auto;
            cursor: grab;
        }

        .compass-wrapper:active {
            cursor: grabbing;
        }

        canvas {
            background: radial-gradient(circle at center, #0a1128 0%, #02040a 100%);
            border-radius: 50%;
            border: 2px solid var(--border-color);
            box-shadow: inset 0 0 40px rgba(0,0,0,0.9);
            display: block;
        }

        .slider-wrapper { margin-bottom: 20px; }

        input[type="range"] {
            width: 100%;
            height: 6px;
            background: var(--border-color);
            border-radius: 4px;
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
            accent-color: var(--text-muted);
        }

        .terminal {
            background: #000;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            height: 140px;
            overflow-y: auto;
            text-align: left;
            font-family: monospace;
            font-size: 8pt;
            margin-top: 15px;
            line-height: 1.4;
        }

        .terminal span { color: var(--text-muted); }
    </style>
</head>
<body>

<div class="container">
    <h1>VORTEX • 18-Cyclus Sonisch Rooster</h1>
    <p>18x13 Matrix | Solide Ruimte: 8.552 sr²</p>
    
    <div class="status-badge">
        <div>Hoek: <strong id="lblAngle">234.9°</strong></div>
        <div>Omwenteling: <strong id="lblRev">0</strong> / 18</div>
    </div>

    <div class="compass-wrapper" id="compassWrapper">
        <canvas id="compassCanvas" width="320" height="320"></canvas>
    </div>

    <div class="slider-wrapper">
        <!-- Range is nu +/- 6480 graden (18 * 360) -->
        <input type="range" id="angleRange" min="-6480" max="6480" value="234.9" step="0.1">
    </div>

    <div class="terminal" id="rtcTerminal">
        <span>[Systeem] Initialisatie Web Audio API...</span><br>
        <span>[Systeem] 18-omwentelingen cyclus geactiveerd.</span><br>
    </div>
</div>

<script>
    const rangeInput = document.getElementById('angleRange');
    const canvas = document.getElementById('compassCanvas');
    const ctx = canvas.getContext('2d');
    const terminal = document.getElementById('rtcTerminal');
    const compassWrapper = document.getElementById('compassWrapper');
    const lblAngle = document.getElementById('lblAngle');
    const lblRev = document.getElementById('lblRev');

    let currentAngle = 234.9;
    let isDragging = false;
    let lastMouseAngle = null;
    const MAX_ANGLE = 6480; // 18 * 360

    // --- AUDIO SYNTHESE ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = new AudioContext();

    function playTone(frequency, type = 'sine') {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        oscillator.type = type;
        oscillator.frequency.value = frequency;
        
        gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.05);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
        
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 1.5);
    }

    function logTerminal(msg) {
        const time = new Date().toISOString().substring(11, 23);
        terminal.innerHTML = `<span>[${time}]</span> ${msg}<br>` + terminal.innerHTML;
    }

    // --- RENDER LOGICA ---
    const backgroundStars = [];
    function initStars() {
        for (let i = 0; i < 80; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = Math.random() * 150;
            backgroundStars.push({
                x: Math.cos(angle) * radius,
                y: Math.sin(angle) * radius,
                size: Math.random() * 1.5 + 0.2,
                alpha: Math.random() * 0.8 + 0.2,
                twinkleSpeed: Math.random() * 0.05 + 0.01
            });
        }
    }

    function drawMarker(cx, cy, radius, angleDeg, color, label) {
        const rad = (angleDeg - 90) * (Math.PI / 180);
        
        const x1 = cx + (radius - 25) * Math.cos(rad);
        const y1 = cy + (radius - 25) * Math.sin(rad);
        const x2 = cx + (radius + 5) * Math.cos(rad);
        const y2 = cy + (radius + 5) * Math.sin(rad);

        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();

        const tx = cx + (radius + 20) * Math.cos(rad);
        const ty = cy + (radius + 20) * Math.sin(rad);
        ctx.fillStyle = color;
        ctx.font = 'bold 9px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, tx, ty);
    }

    function render(time) {
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const radius = 135;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Achtergrondsterren
        backgroundStars.forEach(star => {
            const currentAlpha = star.alpha + Math.sin(time * star.twinkleSpeed) * 0.2;
            ctx.fillStyle = `rgba(226, 232, 240, ${Math.max(0.1, currentAlpha)})`;
            ctx.beginPath();
            ctx.arc(cx + star.x, cy + star.y, star.size, 0, Math.PI * 2);
            ctx.fill();
        });

        // Kompas Ring
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 1;
        for (let i = 0; i < 360; i += 30) {
            const rad = (i - 90) * (Math.PI / 180);
            const x1 = cx + radius * Math.cos(rad);
            const y1 = cy + radius * Math.sin(rad);
            const x2 = cx + (radius - 8) * Math.cos(rad);
            const y2 = cy + (radius - 8) * Math.sin(rad);

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
        }

        // Vaste markeringen
        drawMarker(cx, cy, radius, 124, 'var(--sonic1)', '-236°'); 
        drawMarker(cx, cy, radius, 236, 'var(--sonic2)', '236°');

        const effectiveAngle = ((currentAngle % 360) + 360) % 360;

        // Bepaal kleur pijl
        let vectorColor = '#e74c3c'; // Standaard
        if (Math.abs(effectiveAngle - 124) < 2.0) vectorColor = 'var(--sonic1)';
        if (Math.abs(effectiveAngle - 236) < 2.0) vectorColor = 'var(--sonic2)';
        
        rangeInput.style.accentColor = vectorColor;

        // Hoofdvector
        const rad = (effectiveAngle - 90) * (Math.PI / 180);
        const vx = cx + (radius - 20) * Math.cos(rad);
        const vy = cy + (radius - 20) * Math.sin(rad);

        ctx.strokeStyle = vectorColor;
        ctx.fillStyle = vectorColor;
        ctx.lineWidth = 2.5;
        
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(vx, vy);
        ctx.stroke();

        const headLen = 8;
        const headAngle = Math.atan2(vy - cy, vx - cx);
        ctx.beginPath();
        ctx.moveTo(vx, vy);
        ctx.lineTo(vx - headLen * Math.cos(headAngle - Math.PI / 6), vy - headLen * Math.sin(headAngle - Math.PI / 6));
        ctx.lineTo(vx - headLen * Math.cos(headAngle + Math.PI / 6), vy - headLen * Math.sin(headAngle + Math.PI / 6));
        ctx.lineTo(vx, vy);
        ctx.fill();

        ctx.fillStyle = '#b8860b';
        ctx.beginPath();
        ctx.arc(cx, cy, 4, 0, 2 * Math.PI);
        ctx.fill();

        requestAnimationFrame(render);
    }

    // --- INTERACTIE LOGICA ---
    function updateAngle(newAngle) {
        let tempPrev = currentAngle;
        let tempCurr = newAngle;

        // Cyclus wrap na 18 omwentelingen (6480 graden)
        if (tempCurr >= MAX_ANGLE) {
            tempCurr -= MAX_ANGLE;
            tempPrev -= MAX_ANGLE;
            logTerminal(`<span style="color:var(--gold)">[Cyclus] 18 Positieve omwentelingen bereikt. Rooster gereset.</span>`);
        } else if (tempCurr <= -MAX_ANGLE) {
            tempCurr += MAX_ANGLE;
            tempPrev += MAX_ANGLE;
            logTerminal(`<span style="color:var(--gold)">[Cyclus] 18 Negatieve omwentelingen bereikt. Rooster gereset.</span>`);
        }

        currentAngle = tempCurr;
        rangeInput.value = currentAngle;

        // UI Updates
        lblAngle.innerText = currentAngle.toFixed(1) + '°';
        lblRev.innerText = Math.floor(Math.abs(currentAngle) / 360);

        // Detectie passage over grenzen (124° en 236°)
        // Wiskundig controleren of we de grens in deze stap gepasseerd zijn
        let cross124 = Math.floor((tempPrev - 124) / 360) !== Math.floor((tempCurr - 124) / 360);
        let cross236 = Math.floor((tempPrev - 236) / 360) !== Math.floor((tempCurr - 236) / 360);

        if (cross124) {
            playTone(432, 'sine');
            logTerminal(`► RESONANTIE: As -236° (124°) gepasseerd → <strong style="color:var(--sonic1)">432 Hz</strong>`);
        }
        if (cross236) {
            playTone(110, 'triangle');
            logTerminal(`► RESONANTIE: As 236° gepasseerd → <strong style="color:var(--sonic2)">110 Hz</strong>`);
        }
    }

    rangeInput.addEventListener('input', (e) => {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        updateAngle(parseFloat(e.target.value));
    });

    compassWrapper.addEventListener('mousedown', (e) => {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        isDragging = true;
        lastMouseAngle = getMouseAngle(e);
    });

    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const currentMouseAngle = getMouseAngle(e);
        let delta = currentMouseAngle - lastMouseAngle;

        if (delta > 180) delta -= 360;
        if (delta < -180) delta += 360;

        lastMouseAngle = currentMouseAngle;
        updateAngle(currentAngle + delta);
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    function getMouseAngle(e) {
        const rect = canvas.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const x = e.clientX - cx;
        const y = e.clientY - cy;
        let rad = Math.atan2(y, x) * (180 / Math.PI) + 90;
        if (rad < 0) rad += 360;
        return rad;
    }

    window.onload = function() {
        initStars();
        requestAnimationFrame(render);
    };
</script>

</body>
</html>
