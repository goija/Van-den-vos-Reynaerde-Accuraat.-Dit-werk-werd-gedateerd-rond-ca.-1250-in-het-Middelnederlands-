<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>VORTEX • Sensornet Telemetrie (234 Matrix)</title>
    <style>
        :root {
            --bg-color: #050b14;
            --panel-bg: #0f172a;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --gold: #b8860b;
            --accent: #e74c3c;
            --webrtc: #2ecc71;
            --sonic1: #3498db; /* 432 Hz (-234° / 126°) */
            --sonic2: #e67e22; /* 110 Hz (234°) */
            --sensor: #9b59b6;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.8), inset 0 0 15px rgba(46, 204, 113, 0.05);
            text-align: center;
            max-width: 520px;
            width: 100%;
        }

        h1 {
            margin: 0 0 5px 0;
            font-size: 13pt;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p {
            margin: 0 0 15px 0;
            font-size: 8.5pt;
            color: var(--text-muted);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .status-badge {
            background: rgba(51, 65, 85, 0.4);
            padding: 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 8.5pt;
            text-align: left;
        }
        
        .status-badge span { color: var(--gold); display: block; margin-top: 3px; font-size: 10pt; }
        .status-badge .rtc-status { color: var(--webrtc); }

        .compass-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 0 auto 15px auto;
            cursor: grab;
        }

        .compass-wrapper:active { cursor: grabbing; }

        canvas {
            background: radial-gradient(circle at center, #0a1128 0%, #02040a 100%);
            border-radius: 50%;
            border: 2px solid var(--border-color);
            box-shadow: inset 0 0 40px rgba(0,0,0,0.9);
            display: block;
        }

        .slider-wrapper { margin-bottom: 20px; }

        input[type="range"] {
            width: 100%;
            height: 6px;
            background: var(--border-color);
            border-radius: 4px;
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
            accent-color: var(--text-muted);
        }

        .terminal {
            background: #000;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            height: 150px;
            overflow-y: auto;
            text-align: left;
            font-family: monospace;
            font-size: 8pt;
            line-height: 1.4;
        }

        .terminal span.time { color: var(--text-muted); }
        .terminal span.tx { color: var(--sensor); }
        .terminal span.rx { color: var(--webrtc); }
    </style>
</head>
<body>

<div class="container">
    <h1>VORTEX • 234 Resonantie Matrix</h1>
    <p>18x13 Grid (234) | Solide Ruimte: 8.552 sr² | WebRTC Actief</p>
    
    <div class="dashboard-grid">
        <div class="status-badge">
            Vector Hoek
            <span id="lblAngle">234.9°</span>
        </div>
        <div class="status-badge">
            Cyclus (Max 18)
            <span id="lblRev">0 / 18</span>
        </div>
        <div class="status-badge" style="grid-column: 1 / 3;">
            Data Channel
            <span id="lblRTC" class="rtc-status">Initialiseren...</span>
        </div>
    </div>

    <div class="compass-wrapper" id="compassWrapper">
        <canvas id="compassCanvas" width="320" height="320"></canvas>
    </div>

    <div class="slider-wrapper">
        <input type="range" id="angleRange" min="-6480" max="6480" value="234.9" step="0.1">
    </div>

    <div class="terminal" id="rtcTerminal">
        <span class="time">[Systeem]</span> Web Audio API gereed (Correctie: 234° as).<br>
        <span class="time">[Systeem]</span> Sensornet grid (18x13) rendering gestart.<br>
    </div>
</div>

<script>
    const rangeInput = document.getElementById('angleRange');
    const canvas = document.getElementById('compassCanvas');
    const ctx = canvas.getContext('2d');
    const terminal = document.getElementById('rtcTerminal');
    const compassWrapper = document.getElementById('compassWrapper');
    const lblAngle = document.getElementById('lblAngle');
    const lblRev = document.getElementById('lblRev');
    const lblRTC = document.getElementById('lblRTC');

    let currentAngle = 234.9;
    let isDragging = false;
    let lastMouseAngle = null;
    const MAX_ANGLE = 6480; 
    let packetCount = 0;

    // --- WEBRTC DATA CHANNELS ---
    let localConn, remoteConn, sendChannel, receiveChannel;

    async function initWebRTC() {
        localConn = new RTCPeerConnection();
        remoteConn = new RTCPeerConnection();

        localConn.onicecandidate = e => e.candidate && remoteConn.addIceCandidate(e.candidate);
        remoteConn.onicecandidate = e => e.candidate && localConn.addIceCandidate(e.candidate);

        sendChannel = localConn.createDataChannel('VORTEX_TELEMETRY');
        
        sendChannel.onopen = () => {
            lblRTC.innerText = "GEKOPPELD (TX/RX Actief)";
            logTerminal("Data Channel 'VORTEX_TELEMETRY' geopend.", "sys");
        };

        remoteConn.ondatachannel = e => {
            receiveChannel = e.channel;
            receiveChannel.onmessage = event => {
                const data = JSON.parse(event.data);
                if (packetCount % 5 === 0) {
                    logTerminal(`RX Pakket [${data.id}]: Hoek ${data.angle}°, Cyclus ${data.cyclus}`, "rx");
                }
            };
        };

        const offer = await localConn.createOffer();
        await localConn.setLocalDescription(offer);
        await remoteConn.setRemoteDescription(offer);

        const answer = await remoteConn.createAnswer();
        await remoteConn.setLocalDescription(answer);
        await localConn.setRemoteDescription(answer);
    }

    function sendTelemetry(trigger = null) {
        if (sendChannel && sendChannel.readyState === 'open') {
            packetCount++;
            const payload = {
                id: packetCount,
                timestamp: Date.now(),
                matrix: "18x13",
                space: "8.552 sr2",
                angle: currentAngle.toFixed(1),
                cyclus: Math.floor(Math.abs(currentAngle) / 360),
                event: trigger || "STREAM"
            };
            sendChannel.send(JSON.stringify(payload));

            if (trigger) {
                logTerminal(`TX TRIGGER: ${trigger}`, "tx");
            }
        }
    }

    // --- AUDIO SYNTHESE ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = new AudioContext();

    function playTone(frequency, type = 'sine') {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        oscillator.type = type;
        oscillator.frequency.value = frequency;
        
        gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.05);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
        
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 1.5);
    }

    function logTerminal(msg, type = "sys") {
        const time = new Date().toISOString().substring(11, 23);
        let prefix = `<span class="time">[${time}]</span>`;
        if (type === "tx") prefix = `<span class="tx">[TX]</span>`;
        if (type === "rx") prefix = `<span class="rx">[RX]</span>`;
        
        terminal.innerHTML = `${prefix} ${msg}<br>` + terminal.innerHTML;
    }

    // --- SENSORNET VISUALS ---
    const sensorNodes = [];
    function initSensornet() {
        for (let i = 0; i < 18; i++) {
            const angle = (i / 18) * Math.PI * 2;
            for(let j = 1; j <= 4; j++) {
                sensorNodes.push({
                    x: Math.cos(angle) * (j * 32),
                    y: Math.sin(angle) * (j * 32),
                    phase: Math.random() * Math.PI * 2
                });
            }
        }
    }

    function drawSensornet(cx, cy, time) {
        ctx.strokeStyle = 'rgba(155, 89, 182, 0.15)';
        ctx.lineWidth = 0.5;

        ctx.beginPath();
        for (let i = 0; i < sensorNodes.length; i++) {
            const n1 = sensorNodes[i];
            for (let j = i + 1; j < sensorNodes.length; j++) {
                const n2 = sensorNodes[j];
                const dist = Math.hypot(n2.x - n1.x, n2.y - n1.y);
                if (dist < 45) {
                    ctx.moveTo(cx + n1.x, cy + n1.y);
                    ctx.lineTo(cx + n2.x, cy + n2.y);
                }
            }
        }
        ctx.stroke();

        sensorNodes.forEach(node => {
            const pulse = (Math.sin(time * 0.002 + node.phase) + 1) / 2;
            ctx.fillStyle = `rgba(46, 204, 113, ${0.1 + pulse * 0.4})`;
            ctx.beginPath();
            ctx.arc(cx + node.x, cy + node.y, 1.5 + pulse * 1.5, 0, Math.PI * 2);
            ctx.fill();
        });
    }

    function drawMarker(cx, cy, radius, angleDeg, color, label) {
        const rad = (angleDeg - 90) * (Math.PI / 180);
        const x1 = cx + (radius - 25) * Math.cos(rad);
        const y1 = cy + (radius - 25) * Math.sin(rad);
        const x2 = cx + (radius + 5) * Math.cos(rad);
        const y2 = cy + (radius + 5) * Math.sin(rad);

        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();

        const tx = cx + (radius + 20) * Math.cos(rad);
        const ty = cy + (radius + 20) * Math.sin(rad);
        ctx.fillStyle = color;
        ctx.font = 'bold 9px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, tx, ty);
    }

    function render(time) {
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const radius = 135;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        drawSensornet(cx, cy, time);

        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 1;
        for (let i = 0; i < 360; i += 30) {
            const rad = (i - 90) * (Math.PI / 180);
            const x1 = cx + radius * Math.cos(rad);
            const y1 = cy + radius * Math.sin(rad);
            const x2 = cx + (radius - 8) * Math.cos(rad);
            const y2 = cy + (radius - 8) * Math.sin(rad);
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
        }

        // CORRECTIE: 234 graden en -234 graden (126 genormaliseerd)
        drawMarker(cx, cy, radius, 126, 'var(--sonic1)', '-234°'); 
        drawMarker(cx, cy, radius, 234, 'var(--sonic2)', '234°');

        const effectiveAngle = ((currentAngle % 360) + 360) % 360;

        let vectorColor = '#e74c3c';
        if (Math.abs(effectiveAngle - 126) < 2.0) vectorColor = 'var(--sonic1)';
        if (Math.abs(effectiveAngle - 234) < 2.0) vectorColor = 'var(--sonic2)';
        
        rangeInput.style.accentColor = vectorColor;

        const rad = (effectiveAngle - 90) * (Math.PI / 180);
        const vx = cx + (radius - 20) * Math.cos(rad);
        const vy = cy + (radius - 20) * Math.sin(rad);

        ctx.strokeStyle = vectorColor;
        ctx.fillStyle = vectorColor;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(vx, vy);
        ctx.stroke();

        const headLen = 8;
        const headAngle = Math.atan2(vy - cy, vx - cx);
        ctx.beginPath();
        ctx.moveTo(vx, vy);
        ctx.lineTo(vx - headLen * Math.cos(headAngle - Math.PI / 6), vy - headLen * Math.sin(headAngle - Math.PI / 6));
        ctx.lineTo(vx - headLen * Math.cos(headAngle + Math.PI / 6), vy - headLen * Math.sin(headAngle + Math.PI / 6));
        ctx.lineTo(vx, vy);
        ctx.fill();

        ctx.fillStyle = '#b8860b';
        ctx.beginPath();
        ctx.arc(cx, cy, 4, 0, 2 * Math.PI);
        ctx.fill();

        requestAnimationFrame(render);
    }

    // --- INTERACTIE & LOGICA ---
    let throttleTimer;
    function updateAngle(newAngle) {
        let tempPrev = currentAngle;
        let tempCurr = newAngle;

        if (tempCurr >= MAX_ANGLE) {
            tempCurr -= MAX_ANGLE; tempPrev -= MAX_ANGLE;
            logTerminal(`<span style="color:var(--gold)">18 Positieve omwentelingen bereikt. Reset.</span>`);
        } else if (tempCurr <= -MAX_ANGLE) {
            tempCurr += MAX_ANGLE; tempPrev += MAX_ANGLE;
            logTerminal(`<span style="color:var(--gold)">18 Negatieve omwentelingen bereikt. Reset.</span>`);
        }

        currentAngle = tempCurr;
        rangeInput.value = currentAngle;

        lblAngle.innerText = currentAngle.toFixed(1) + '°';
        lblRev.innerText = Math.floor(Math.abs(currentAngle) / 360) + ' / 18';

        // CORRECTIE: Wiskundige detectie voor passage over 126° (-234°) en 234°
        let cross126 = Math.floor((tempPrev - 126) / 360) !== Math.floor((tempCurr - 126) / 360);
        let cross234 = Math.floor((tempPrev - 234) / 360) !== Math.floor((tempCurr - 234) / 360);

        if (cross126) {
            playTone(432, 'sine');
            sendTelemetry("SONIC_PULSE_432HZ_NEG234");
            logTerminal(`► RESONANTIE: As -234° (126°) gepasseerd → <strong style="color:var(--sonic1)">432 Hz</strong>`);
        }
        if (cross234) {
            playTone(110, 'triangle');
            sendTelemetry("SONIC_PULSE_110HZ_POS234");
            logTerminal(`► RESONANTIE: As 234° gepasseerd → <strong style="color:var(--sonic2)">110 Hz</strong>`);
        }

        if (!throttleTimer) {
            throttleTimer = setTimeout(() => {
                sendTelemetry();
                throttleTimer = null;
            }, 100);
        }
    }

    rangeInput.addEventListener('input', (e) => {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        updateAngle(parseFloat(e.target.value));
    });

    compassWrapper.addEventListener('mousedown', (e) => {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        isDragging = true;
        lastMouseAngle = getMouseAngle(e);
    });

    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const currentMouseAngle = getMouseAngle(e);
        let delta = currentMouseAngle - lastMouseAngle;

        if (delta > 180) delta -= 360;
        if (delta < -180) delta += 360;

        lastMouseAngle = currentMouseAngle;
        updateAngle(currentAngle + delta);
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    function getMouseAngle(e) {
        const rect = canvas.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const x = e.clientX - cx;
        const y = e.clientY - cy;
        let rad = Math.atan2(y, x) * (180 / Math.PI) + 90;
        if (rad < 0) rad += 360;
        return rad;
    }

    window.onload = function() {
        initWebRTC();
        initSensornet();
        requestAnimationFrame(render);
    };
</script>

</body>
</html>
