<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>VORTEX • Dual Vector Kompas (60° & 160°)</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --gold: #b8860b;
            --accent-wood: #27ae60;
            --accent-fire: #e74c3c;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            text-align: center;
            max-width: 420px;
            width: 100%;
        }

        h1 {
            margin: 0 0 5px 0;
            font-size: 15pt;
            color: var(--gold);
        }

        p {
            margin: 0 0 15px 0;
            font-size: 9pt;
            color: var(--text-muted);
        }

        .compass-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto 15px auto;
            cursor: grab;
        }

        .compass-wrapper:active {
            cursor: grabbing;
        }

        canvas {
            background: var(--bg-color);
            border-radius: 50%;
            border: 2px solid var(--border-color);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
            display: block;
        }

        .slider-wrapper {
            margin-bottom: 15px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--gold);
            cursor: pointer;
        }

        .controls {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--gold);
            color: #0f172a;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 8pt;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .info-panel {
            font-size: 8.5pt;
            background: var(--bg-color);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>VORTEX • Dual Vector Kompas</h1>
    <p>Ternaire Modulatie met vaste hoeken (60° & 160°)</p>

    <div class="compass-wrapper" id="compassWrapper">
        <canvas id="compassCanvas" width="280" height="280"></canvas>
    </div>

    <div class="slider-wrapper">
        <input type="range" id="angleRange" min="-3600" max="3600" value="160" step="1">
    </div>

    <div class="controls">
        <button onclick="setAngle(60)">Hoek 60° (+1)</button>
        <button onclick="setAngle(160)">Hoek 160° (SSO)</button>
        <button onclick="setAngle(-60)">Hoek -60° (-1)</button>
        <button onclick="setAngle(-160)">Hoek -160°</button>
    </div>

    <div class="info-panel" id="infoText">
        Totale Hoek: <strong>160°</strong> | Ternaire Stroom: +1 | 8.552 sr²
    </div>
</div>

<script>
    const rangeInput = document.getElementById('angleRange');
    const infoText = document.getElementById('infoText');
    const canvas = document.getElementById('compassCanvas');
    const ctx = canvas.getContext('2d');
    const compassWrapper = document.getElementById('compassWrapper');

    let isDragging = false;
    let accumulatedAngle = 160;
    let lastMouseAngle = null;

    function drawPentagon(cx, cy, radius, rotationOffset, strokeStyle, lineWidth) {
        ctx.strokeStyle = strokeStyle;
        ctx.lineWidth = lineWidth;
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
            const angle = rotationOffset + (i * 2 * Math.PI / 5) - (Math.PI / 2);
            const x = cx + radius * Math.cos(angle);
            const y = cy + radius * Math.sin(angle);
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
    }

    function drawCompass(angle) {
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const radius = 115;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Dubbele vijfhoeken
        drawPentagon(cx, cy, radius - 15, 0, 'rgba(51, 65, 85, 0.8)', 1.5);
        drawPentagon(cx, cy, radius - 35, Math.PI / 5, 'rgba(184, 134, 11, 0.4)', 1);

        // Buitenste schaalverdeling in ternaire symbolen (-1, 0, 1)
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 1;
        for (let i = 0; i < 360; i += 30) {
            const rad = (i - 90) * (Math.PI / 180);
            const x1 = cx + radius * Math.cos(rad);
            const y1 = cy + radius * Math.sin(rad);
            const x2 = cx + (radius - 8) * Math.cos(rad);
            const y2 = cy + (radius - 8) * Math.sin(rad);

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();

            const tx = cx + (radius - 20) * Math.cos(rad);
            const ty = cy + (radius - 20) * Math.sin(rad);
            ctx.fillStyle = '#94a3b8';
            ctx.font = '9px monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            let ternaryVal = "0";
            if (i > 0 && i < 180) ternaryVal = "+1";
            else if (i > 180) ternaryVal = "-1";
            ctx.fillText(ternaryVal, tx, ty);
        }

        // Hulplijnen voor de specifieke hoeken 60° en 160°
        [60, 160].forEach((targetAngle, idx) => {
            const targetRad = (targetAngle - 90) * (Math.PI / 180);
            const tx1 = cx + (radius - 35) * Math.cos(targetRad);
            const ty1 = cy + (radius - 35) * Math.sin(targetRad);
            
            ctx.strokeStyle = idx === 0 ? 'rgba(39, 174, 96, 0.5)' : 'rgba(231, 76, 60, 0.5)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([2, 2]);
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(tx1, ty1);
            ctx.stroke();
            ctx.setLineDash([]); // Reset dash
        });

        const effectiveAngle = ((angle % 360) + 360) % 360;
        const revolutions = Math.floor(angle / 360);

        let ternaryState = "0 (Neutrale As)";
        let ternarySymbol = "0";
        if (effectiveAngle > 0 && effectiveAngle < 180) {
            ternaryState = "+1 (Actieve Positieve Stroom)";
            ternarySymbol = "+1";
        } else if (effectiveAngle > 180 && effectiveAngle < 360) {
            ternaryState = "-1 (Terugkerende Negatieve Stroom)";
            ternarySymbol = "-1";
        }

        // Hoofdvector pijl
        const rad = (effectiveAngle - 90) * (Math.PI / 180);
        const vx = cx + (radius - 45) * Math.cos(rad);
        const vy = cy + (radius - 45) * Math.sin(rad);

        ctx.strokeStyle = '#e74c3c';
        ctx.fillStyle = '#e74c3c';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(vx, vy);
        ctx.stroke();

        const headLen = 10;
        const headAngle = Math.atan2(vy - cy, vx - cx);
        ctx.beginPath();
        ctx.moveTo(vx, vy);
        ctx.lineTo(vx - headLen * Math.cos(headAngle - Math.PI / 6), vy - headLen * Math.sin(headAngle - Math.PI / 6));
        ctx.lineTo(vx - headLen * Math.cos(headAngle + Math.PI / 6), vy - headLen * Math.sin(headAngle + Math.PI / 6));
        ctx.lineTo(vx, vy);
        ctx.fill();

        ctx.fillStyle = '#b8860b';
        ctx.beginPath();
        ctx.arc(cx, cy, 4, 0, 2 * Math.PI);
        ctx.fill();

        infoText.innerHTML = `Totale Hoek: <strong>${Math.round(angle)}°</strong> | Omwenteling: ${revolutions} <br>Ternaire Code: [<strong>${ternarySymbol}</strong>] → ${ternaryState} | <strong>8.552 sr²</strong>`;
    }

    function setAngle(angle) {
        accumulatedAngle = angle;
        if (rangeInput.max < Math.abs(angle)) {
            rangeInput.max = Math.ceil(Math.abs(angle) / 360) * 360 + 360;
            rangeInput.min = -rangeInput.max;
        }
        rangeInput.value = angle;
        drawCompass(angle);
    }

    rangeInput.addEventListener('input', (e) => {
        accumulatedAngle = parseFloat(e.target.value);
        drawCompass(accumulatedAngle);
    });

    compassWrapper.addEventListener('mousedown', (e) => {
        isDragging = true;
        lastMouseAngle = getMouseAngle(e);
    });

    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const currentMouseAngle = getMouseAngle(e);
        let delta = currentMouseAngle - lastMouseAngle;

        if (delta > 180) delta -= 360;
        if (delta < -180) delta += 360;

        accumulatedAngle += delta;
        lastMouseAngle = currentMouseAngle;

        if (Math.abs(accumulatedAngle) > parseInt(rangeInput.max)) {
            const newMax = Math.ceil(Math.abs(accumulatedAngle) / 360) * 360;
            rangeInput.max = newMax;
            rangeInput.min = -newMax;
        }
        rangeInput.value = accumulatedAngle;
        drawCompass(accumulatedAngle);
    });

    window.addEventListener('mouseup', () => {
        isDragging = false;
    });

    function getMouseAngle(e) {
        const rect = canvas.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const x = e.clientX - cx;
        const y = e.clientY - cy;
        let rad = Math.atan2(y, x) * (180 / Math.PI) + 90;
        if (rad < 0) rad += 360;
        return rad;
    }

    window.onload = function() {
        drawCompass(accumulatedAngle);
    };
</script>

</body>
</html>
