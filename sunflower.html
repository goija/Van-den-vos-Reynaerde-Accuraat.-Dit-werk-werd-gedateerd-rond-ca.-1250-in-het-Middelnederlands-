<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fibonacci Zonnebloemspiraal (Vogel's Model)</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            margin-bottom: 5px;
            font-size: 1.6rem;
            color: #fbbf24;
            text-align: center;
        }
        p {
            color: #94a3b8;
            margin-bottom: 20px;
            text-align: center;
            max-width: 600px;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            background-color: #1e293b;
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }
        label {
            font-size: 0.95rem;
            color: #e2e8f0;
        }
        input[type="range"] {
            cursor: pointer;
            accent-color: #fbbf24;
        }
        span#countVal {
            font-weight: bold;
            color: #fbbf24;
            min-width: 45px;
            display: inline-block;
        }
        #canvas-container {
            background-color: #1e293b;
            border-radius: 16px;
            border: 1px solid #334155;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <h1>De Fibonacci Zonnebloemspiraal (Vogel's Model)</h1>
    <p>Simulatie van de natuurlijke zaadverdeling op basis van de gulden hoek en de Fibonacci-getallen ontdekt door Albert Girard.</p>

    <div class="controls">
        <label for="seedRange">Aantal Zaden (n):</label>
        <input type="range" id="seedRange" min="100" max="2500" step="50" value="1000">
        <span id="countVal">1000</span>
    </div>

    <div id="canvas-container">
        <canvas id="sunflowerCanvas" width="650" height="650"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('sunflowerCanvas');
        const ctx = canvas.getContext('2d');
        const seedRange = document.getElementById('seedRange');
        const countVal = document.getElementById('countVal');

        const phi = (1 + Math.sqrt(5)) / 2; // Gulden snede
        const goldenAngle = 2 * Math.PI * (1 - 1 / phi); // Ca. 137.5 graden in radialen

        function drawSunflower(nSeeds) {
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const c = 10; // Schaalconstante voor de straal

            for (let i = 0; i < nSeeds; i++) {
                const theta = i * goldenAngle;
                const r = c * Math.sqrt(i);

                const x = centerX + r * Math.cos(theta);
                const y = centerY + r * Math.sin(theta);

                // Kleurvariatie op basis van de positie voor een prachtig diepte-effect
                const hue = 35 + (i * 0.15) % 360; 
                const radius = Math.max(1.5, Math.min(4, 1.2 + (i / nSeeds) * 2.5));

                ctx.beginPath();
                ctx.arc(x, y, radius, 0, 2 * Math.PI);
                ctx.fillStyle = `hsl(${hue}, 85%, 55%)`;
                ctx.fill();

                ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.lineWidth = 0.5;
                ctx.stroke();
            }
        }

        function update() {
            const n = parseInt(seedRange.value);
            countVal.textContent = n;
            drawSunflower(n);
        }

        seedRange.addEventListener('input', update);

        // Initiële tekening
        update();
    </script>
</body>
</html>
