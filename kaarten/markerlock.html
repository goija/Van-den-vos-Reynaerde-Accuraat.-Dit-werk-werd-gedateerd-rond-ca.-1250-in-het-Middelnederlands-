<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4D Psychogeografische Kaart: Versleepbare Kubussen & Rotatie</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; background-color: #1a1a2e; overflow: hidden; }
        
        /* De hele container draait mee, inclusief markers en popups */
        #kaart-container { 
            height: 100vh; 
            width: 100%; 
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: center center;
        }
        
        #kaart { height: 100%; width: 100%; background: #16213e; }
        
        /* Rotatie-paneel rechtsboven */
        #rotatie-paneel {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .rotatie-knop {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 10px 15px;
            font-family: monospace;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }
        .rotatie-knop:hover { background-color: #ff6b81; }

        /* Stijl voor de versleepbare kubussen */
        .kubus-icoon {
            color: #fff; 
            border: 2px solid #0f3460; 
            width: 28px; 
            height: 28px;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-weight: bold; 
            font-size: 12px;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.8);
            cursor: grab; /* Laat zien dat je het kunt oppakken */
        }
        .kubus-icoon:active { cursor: grabbing; }
        
        .knoop-nulpunt { background-color: #e94560; } 
        .knoop-water { background-color: #0f3460; }   
        .knoop-aarde { background-color: #53354a; }   
        .knoop-echo { background-color: #e67e22; }    
        
        .leaflet-popup-content-wrapper { background-color: #ffffff; color: #333; }
        .popup-content h3 { margin: 0 0 5px 0; color: #111; border-bottom: 1px solid #ccc; padding-bottom: 3px; font-size: 15px;}
        .popup-content p { margin: 5px 0 0 0; font-size: 13px; line-height: 1.5; color: #333; }
        .data-tag { font-family: monospace; font-size: 11px; background: #f0f0f0; padding: 2px 4px; border-radius: 3px; color: #e94560; font-weight: bold;}
    </style>
</head>
<body>

    <!-- Rotatie Knoppen -->
    <div id="rotatie-paneel">
        <button class="rotatie-knop" onclick="draaiKaart(0)">0° (Reset)</button>
        <button class="rotatie-knop" onclick="draaiKaart(91)">Draai 91°</button>
        <button class="rotatie-knop" onclick="draaiKaart(181)">Draai 181°</button>
        <button class="rotatie-knop" onclick="draaiKaart(234)">Draai 234°</button>
        <button class="rotatie-knop" onclick="draaiKaart(361)">Draai 361°</button>
    </div>

    <!-- Container die volledig meedraait -->
    <div id="kaart-container">
        <div id="kaart"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Functie om de kaart en alle elementen te roteren
        function draaiKaart(graden) {
            document.getElementById('kaart-container').style.transform = `rotate(${graden}deg)`;
        }

        const projectData = [
            { "fase": 0, "iteratie": -17, "congruentie_mod_21": 4, "locatie": "Oude Kerk Amsterdam", "type": "knoop-nulpunt", "beschrijving": "<b>[FASE 0]</b><br>Zerk Hendrik Lonck." },
            { "fase": 1, "iteratie": -50, "congruentie_mod_21": 13, "locatie": "Het Zeeuwse Estuarium", "type": "knoop-water", "beschrijving": "<b>[FASE 1]</b><br>De Delta & expansie." },
            { "fase": 2, "iteratie": -25, "congruentie_mod_21": 17, "locatie": "Roosendaal", "type": "knoop-aarde", "beschrijving": "<b>[FASE 2]</b><br>Geologische Klei." },
            { "fase": 3, "iteratie": -74, "congruentie_mod_21": 10, "locatie": "Tamale, Ghana", "type": "knoop-echo", "beschrijving": "<b>[FASE 3]</b><br>Trans-Atlantische Echo." },
            { "fase": 4, "iteratie": -17, "congruentie_mod_21": 4, "locatie": "Oude Kerk Amsterdam", "type": "knoop-nulpunt", "beschrijving": "<b>[SLUITING]</b>" }
        ];

        const radius = 45; 
        const kolommen = 13;
        const rijen = 18;

        function genereerHexRaster(cols, rows, r) {
            const canvas = document.createElement('canvas');
            const hBreedte = Math.sqrt(3) * r;
            const hHoogte = 2 * r;
            canvas.width = cols * hBreedte + (hBreedte / 2);
            canvas.height = rows * (hHoogte * 0.75) + (hHoogte / 4);
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#16213e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Bloemgeometrie
            let cx = canvas.width / 2;
            let cy = canvas.height / 2;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)'; 
            ctx.lineWidth = 3;
            for(let i=0; i<4; i++) {
                ctx.beginPath();
                ctx.arc(cx + (i<2 ? 0 : (i==2?100:-100)), cy + (i<2 ? (i==0?-100:100) : 0), 100, 0, Math.PI*2);
                ctx.stroke();
            }

            // Raster lijnen & coördinatentekst in het wit
            ctx.strokeStyle = 'rgba(15, 52, 96, 0.7)'; 
            for (let rij = 0; rij < rows; rij++) {
                for (let kol = 0; kol < cols; kol++) {
                    let x = kol * hBreedte + (rij % 2 === 1 ? hBreedte / 2 : 0) + hBreedte / 2;
                    let y = rij * (hHoogte * 0.75) + hHoogte / 2;
                    ctx.beginPath();
                    for (let i = 0; i < 6; i++) {
                        let hoek = (Math.PI / 180) * (60 * i - 30);
                        ctx.lineTo(x + r * Math.cos(hoek), y + r * Math.sin(hoek));
                    }
                    ctx.closePath(); ctx.stroke();

                    ctx.fillStyle = '#ffffff';
                    ctx.font = '10px Courier New';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.globalAlpha = 0.4;
                    ctx.fillText(`${kol},${rij}`, x, y);
                    ctx.globalAlpha = 1.0;
                }
            }
            return { imgData: canvas.toDataURL('image/png'), w: canvas.width, h: canvas.height };
        }

        const raster = genereerHexRaster(kolommen, rijen, radius);
        var map = L.map('kaart', { minZoom: -1, maxZoom: 3, crs: L.CRS.Simple });
        var bounds = [[0, 0], [raster.h, raster.w]]; 
        L.imageOverlay(raster.imgData, bounds).addTo(map);
        map.fitBounds(bounds);

        function getHexCenterCoords(kolom, rij) {
            const hB = Math.sqrt(3) * radius;
            const hH = 2 * radius;
            return [raster.h - (rij * (hH * 0.75) + hH / 2), kolom * hB + (rij % 2 === 1 ? hB / 2 : 0) + hB / 2];
        }

        // Plaats versleepbare markers op het grid
        projectData.forEach(function(punt) {
            let coords = getHexCenterCoords(punt.congruentie_mod_21 % 13, (punt.fase * 3) % 18);
            
            var customIcon = L.divIcon({ 
                className: '', 
                html: `<div class="kubus-icoon ${punt.type}">${punt.fase}</div>`, 
                iconSize: [28, 28], 
                iconAnchor: [14, 14] 
            });

            // draggable: true maakt de blokjes versleepbaar over de kaart!
            var marker = L.marker(coords, { icon: customIcon, draggable: true }).addTo(map);

            marker.bindPopup(`
                <div class="popup-content">
                    <h3>${punt.locatie}</h3>
                    <p>${punt.beschrijving}</p>
                    <p><span class="data-tag" id="coord-${punt.fase}">Positie: [${punt.congruentie_mod_21 % 13}, ${(punt.fase * 3) % 18}]</span></p>
                </div>
            `);

            // Event: Laat nieuwe coördinaten zien zodra je een kubus versleept en loslaat
            marker.on('dragend', function(event) {
                var position = marker.getLatLng();
                console.log(`Kubus ${punt.fase} verplaatst naar Y: ${position.lat.toFixed(1)}, X: ${position.lng.toFixed(1)}`);
            });
        });
    </script>
</body>
</html>
